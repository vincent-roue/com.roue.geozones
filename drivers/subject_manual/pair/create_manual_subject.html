<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GeoZones</title>
<style>
body{padding:16px;} .actions{margin-top:24px} .help{margin-top:8px;color:var(--homey-color-text-light);font-size:14px;line-height:1.45} .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:520px){.row2{grid-template-columns:1fr}}
</style></head><body>
<header class="homey-header"><h1 class="homey-title" id="title"></h1><p class="homey-subtitle" id="subtitle"></p></header>
<section id="recovery" hidden style="margin-bottom:28px"><form class="homey-form" id="recovery-form"><fieldset class="homey-form-fieldset"><legend class="homey-form-legend" id="recovery-title"></legend><p class="help" id="recovery-help"></p><div class="homey-form-group"><label class="homey-form-label" for="legacy-subject" id="legacy-label"></label><select class="homey-form-select" id="legacy-subject"></select></div><div class="homey-form-group"><label class="homey-form-label" for="recovery-name" id="recovery-name-label"></label><input class="homey-form-input" id="recovery-name" type="text" maxlength="128" autocomplete="off"></div><p class="help" id="recovery-source" hidden></p><button class="homey-button-primary-full" id="recover" type="submit"></button></fieldset></form></section>
<form class="homey-form" id="manual-form">
<fieldset class="homey-form-fieldset"><legend class="homey-form-legend" id="legend-subject"></legend>
<div class="homey-form-group"><label class="homey-form-label" for="name" id="label-name"></label><input class="homey-form-input" id="name" type="text" maxlength="128" autocomplete="off" /></div>
<div class="homey-form-group"><label class="homey-form-label" for="subjectType" id="label-type"></label><input class="homey-form-input" id="subjectType" type="text" maxlength="128" autocomplete="off" /></div>
<div class="homey-form-group"><label class="homey-form-label" for="minMoveDistanceM" id="label-min"></label><input class="homey-form-input" id="minMoveDistanceM" type="number" min="0" step="1" value="0" /></div>
<div class="homey-form-group"><fieldset class="homey-form-checkbox-set"><legend class="homey-form-checkbox-set-title" id="legend-state"></legend><label class="homey-form-checkbox"><input class="homey-form-checkbox-input" id="enabled" type="checkbox" checked /><span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" id="label-enabled"></span></label></fieldset></div>
</fieldset>
<div class="actions"><button class="homey-button-primary-full" id="create" type="submit"></button><p class="help" id="help"></p></div></form>
<script>
const t={en:{title:'Create manual subject',subtitle:'Create a GeoZones subject whose position is updated manually from a Flow card.',legendSubject:'Subject',name:'Name',type:'Subject type',min:'Minimum move distance (m)',state:'State',enabled:'Subject enabled',create:'Create subject',help:'The name must be unique among all GeoZones subjects. Subject type is free text, so keep the same spelling everywhere you reuse it.'},fr:{title:'Créer un sujet manuel',subtitle:'Créez un sujet GeoZones dont la position est mise à jour manuellement depuis une carte Flow.',legendSubject:'Sujet',name:'Nom',type:'Type de sujet',min:'Distance minimale de mouvement (m)',state:'État',enabled:'Sujet activé',create:'Créer le sujet',help:'Le nom doit être unique parmi tous les sujets GeoZones. Le type de sujet est une valeur libre : gardez la même orthographe partout où vous le réutilisez.'},nl:{title:'Handmatig onderwerp maken',subtitle:'Maak een GeoZones-onderwerp waarvan de positie handmatig vanuit een Flow wordt bijgewerkt.',legendSubject:'Onderwerp',name:'Naam',type:'Type onderwerp',min:'Minimale bewegingsafstand (m)',state:'Status',enabled:'Onderwerp ingeschakeld',create:'Onderwerp maken',help:'De naam moet uniek zijn onder GeoZones-onderwerpen. Het onderwerpstype is vrije tekst, dus gebruik overal dezelfde schrijfwijze.'},de:{title:'Manuelles Subjekt erstellen',subtitle:'Erstellt ein GeoZones-Subjekt, dessen Position manuell aus einem Flow aktualisiert wird.',legendSubject:'Subjekt',name:'Name',type:'Subjekttyp',min:'Minimale Bewegungsdistanz (m)',state:'Status',enabled:'Subjekt aktiviert',create:'Subjekt erstellen',help:'Der Name muss unter den GeoZones-Subjekten eindeutig sein. Der Subjekttyp ist ein freier Textwert; verwenden Sie überall dieselbe Schreibweise.'}};
const requestedLang=String(Homey.getLanguage?.()||'en').slice(0,2).toLowerCase(); const lang=t[requestedLang]?requestedLang:'en'; const i=t[lang]; document.documentElement.lang=lang;
Homey.setTitle(i.title); document.getElementById('title').textContent=i.title; document.getElementById('subtitle').textContent=i.subtitle; document.getElementById('legend-subject').textContent=i.legendSubject; document.getElementById('label-name').textContent=i.name; document.getElementById('label-type').textContent=i.type; document.getElementById('label-min').textContent=i.min; document.getElementById('legend-state').textContent=i.state; document.getElementById('label-enabled').textContent=i.enabled; document.getElementById('create').textContent=i.create; document.getElementById('help').textContent=i.help;
const form=document.getElementById('manual-form'); const createButton=document.getElementById('create'); function parseNonNegativeNumber(value,fallback){const n=Number(value);return Number.isFinite(n)&&n>=0?n:fallback;}
form.addEventListener('submit', async (event)=>{event.preventDefault(); if(createButton.disabled) return; createButton.disabled=true; createButton.classList.add('is-loading'); try{Homey.showLoadingOverlay(); const payload={name:document.getElementById('name').value, subjectType:document.getElementById('subjectType').value, enabled:document.getElementById('enabled').checked, minMoveDistanceM:parseNonNegativeNumber(document.getElementById('minMoveDistanceM').value,0)}; const device=await Homey.emit('create_manual_subject', payload); await Homey.createDevice(device); Homey.done(); }catch(error){ await Homey.alert(error&&error.message?error.message:String(error),'error'); } finally{Homey.hideLoadingOverlay(); createButton.disabled=false; createButton.classList.remove('is-loading');} });
</script>
<script>
const recoveryText={
en:{title:'Recover legacy subjects',help:'Recover each subject with its settings and last saved state. The original backup is retained. Reconnect location updates and recreate your Flows using the new cards; legacy Flows are not restored. If you change the name, also update subject filters in your zones.',subject:'Subject to recover',name:'Device name (must be unique)',button:'Recover this subject',source:'This subject had a linked source. Its information is preserved, but automatic linking has been removed. Send its latitude and longitude using the position update Flow card.'},
fr:{title:'Récupérer les anciens sujets',help:'Récupérez chaque sujet avec ses réglages et son dernier état enregistré. La sauvegarde d’origine est conservée. Rebranchez les mises à jour de position et recréez vos Flows avec les nouvelles cartes : les anciens Flows ne sont pas restaurés. Si vous changez le nom, adaptez aussi les filtres de sujets dans vos zones.',subject:'Sujet à récupérer',name:'Nom de l’appareil (unique)',button:'Récupérer ce sujet',source:'Ce sujet avait une source liée. Ses informations sont conservées, mais la liaison automatique a été retirée. Envoyez sa latitude et sa longitude avec la carte Flow de mise à jour de position.'},
nl:{title:'Oude onderwerpen herstellen',help:'Herstel elk onderwerp met de instellingen en laatst opgeslagen status. De originele back-up blijft bewaard. Verbind locatie-updates opnieuw en maak Flows met de nieuwe kaarten; oude Flows worden niet hersteld. Pas ook de onderwerpfilters van zones aan als je de naam wijzigt.',subject:'Te herstellen onderwerp',name:'Apparaatnaam (uniek)',button:'Dit onderwerp herstellen',source:'Dit onderwerp had een gekoppelde bron. De brongegevens blijven bewaard, maar automatisch koppelen is verwijderd. Stuur de breedte- en lengtegraad met de Flow-kaart voor positie-updates.'},
de:{title:'Alte Subjekte wiederherstellen',help:'Stellen Sie jedes Subjekt mit Einstellungen und zuletzt gespeichertem Zustand wieder her. Die Originalsicherung bleibt erhalten. Verbinden Sie Positionsupdates erneut und erstellen Sie Flows mit den neuen Karten; alte Flows werden nicht wiederhergestellt. Passen Sie bei einer Namensänderung auch die Subjektfilter Ihrer Zonen an.',subject:'Wiederherzustellendes Subjekt',name:'Gerätename (eindeutig)',button:'Dieses Subjekt wiederherstellen',source:'Dieses Subjekt hatte eine verknüpfte Quelle. Die Quelldaten bleiben erhalten, aber die automatische Verknüpfung wurde entfernt. Übermitteln Sie Breiten- und Längengrad mit der Flow-Karte zur Positionsaktualisierung.'}
};
const recoveryI=recoveryText[lang]||recoveryText.en;
for(const [id,key] of Object.entries({'recovery-title':'title','recovery-help':'help','legacy-label':'subject','recovery-name-label':'name',recover:'button','recovery-source':'source'})) document.getElementById(id).textContent=recoveryI[key];
let legacySubjects=[];
function showLegacySelection(){const subject=legacySubjects.find(row=>row.id===document.getElementById('legacy-subject').value);document.getElementById('recovery-name').value=subject?subject.name:'';document.getElementById('recovery-source').hidden=!subject||!subject.hasSource;}
document.getElementById('legacy-subject').addEventListener('change',showLegacySelection);
document.getElementById('recovery-form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('recover');if(button.disabled||createButton.disabled)return;button.disabled=true;createButton.disabled=true;button.classList.add('is-loading');try{Homey.showLoadingOverlay();const device=await Homey.emit('recover_legacy_subject',{id:document.getElementById('legacy-subject').value,name:document.getElementById('recovery-name').value});await Homey.createDevice(device);Homey.done();}catch(error){await Homey.alert(error&&error.message?error.message:String(error),'error');}finally{Homey.hideLoadingOverlay();button.disabled=false;createButton.disabled=false;button.classList.remove('is-loading');}});
(async()=>{try{legacySubjects=await Homey.emit('list_legacy_subjects');for(const subject of legacySubjects){const option=document.createElement('option');option.value=subject.id;option.textContent=subject.name+(subject.subjectType?' ('+subject.subjectType+')':'');document.getElementById('legacy-subject').appendChild(option);}document.getElementById('recovery').hidden=legacySubjects.length===0;showLegacySelection();}catch(error){await Homey.alert(error&&error.message?error.message:String(error),'error');}})();
</script></body></html>
